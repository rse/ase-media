<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>ASE</title>
        <script src="libs/hls.js"></script>
        <script src="libs/plyr.js"></script>
        <link href="libs/plyr.css" rel="stylesheet">
        <script src="video.js"></script>
        <link href="video.css" rel="stylesheet">
        <style type="text/css">
            html, body {
                background: #336699;
                color: #ffffff;
                font-family: sans-serif;
            }
            body {
                padding: 20px 50px;
            }
            h1 {
                font-weight: 300;
            }
            .tiles {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 20px;
                margin: 20px 0;
            }
            .tile {
                position: relative;
                display: block;
                border: none;
                padding: 0;
                margin: 0;
                cursor: pointer;
                border-radius: 10px;
                overflow: hidden;
                background: #00000020;
                aspect-ratio: 1200/1400;
                filter: drop-shadow(0px 0px 4px #00000080);
                transition: transform 0.15s ease;
            }
            .tile:hover,
            .tile:focus-visible {
                transform: scale(1.03);
                outline: none;
            }
            .tile img {
                display: block;
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
            .tile .caption {
                position: absolute;
                left: 0;
                right: 0;
                bottom: 0;
                padding: 8px 10px;
                font-size: 14px;
                color: #ffffff;
                background: linear-gradient(transparent, #336699);
            }
            dialog.modal {
                border: none;
                padding: 0;
                background: transparent;
                color: #ffffff;
                max-width: 100vw;
                max-height: 100vh;
                overflow: visible;
            }
            dialog.modal::backdrop {
                background: #00336680;
            }
            dialog.modal .close {
                position: absolute;
                top: -14px;
                right: -14px;
                width: 36px;
                height: 36px;
                border: none;
                border-radius: 50%;
                background: #336699e0;
                color: #ffffff;
                font-size: 20px;
                line-height: 36px;
                text-align: center;
                cursor: pointer;
                z-index: 10;
                filter: drop-shadow(0px 0px 4px #00000080);
            }
            dialog.modal .body {
                display: flex;
                justify-content: center;
                align-items: center;
            }
        </style>
    </head>
    <body>
        <div id="tiles" class="tiles"></div>

        <dialog id="modal" class="modal">
            <button type="button" class="close" aria-label="Close">&times;</button>
            <div class="body"></div>
        </dialog>

        <script>
            const entries = [
                "ase-mix-1",
                "ase-mix-2",
                "ase-mix-3",
                "ase-meta-diaboli",
                "ase-code-analyze",
                "ase-arch-discover",
            ]

            const tiles = document.getElementById("tiles")
            const modal = document.getElementById("modal")
            const body  = modal.querySelector(".body")
            const close = modal.querySelector(".close")

            const openModal = (name) => {
                body.innerHTML = ""
                const wrapper = document.createElement("div")
                wrapper.className = "video"
                const video = document.createElement("video")
                video.setAttribute("poster", name + ".jpg")
                video.setAttribute("controls", "")
                video.setAttribute("autoplay", "")
                video.setAttribute("loop", "")
                video.setAttribute("muted", "")
                video.setAttribute("playsinline", "")
                const mp4 = document.createElement("source")
                mp4.setAttribute("src", name + ".mp4")
                mp4.setAttribute("type", "video/mp4; codecs=avc1.4d401f")
                const hls = document.createElement("source")
                hls.setAttribute("src", name + ".hls/index.m3u8")
                hls.setAttribute("type", "application/vnd.apple.mpegurl")
                video.appendChild(mp4)
                video.appendChild(hls)
                wrapper.appendChild(video)
                body.appendChild(wrapper)
                modal.showModal()
                setupVideo(video)
            }

            const closeModal = () => {
                modal.close()
            }

            modal.addEventListener("close", () => {
                body.innerHTML = ""
            })
            close.addEventListener("click", closeModal)
            modal.addEventListener("click", (ev) => {
                if (ev.target === modal)
                    closeModal()
            })

            for (const name of entries) {
                const tile = document.createElement("button")
                tile.type = "button"
                tile.className = "tile"
                const img = document.createElement("img")
                img.src = name + ".jpg"
                img.alt = name
                img.loading = "lazy"
                const caption = document.createElement("span")
                caption.className = "caption"
                caption.textContent = name
                tile.appendChild(img)
                tile.appendChild(caption)
                tile.addEventListener("click", () => openModal(name))
                tiles.appendChild(tile)
            }
        </script>
    </body>
</html>
